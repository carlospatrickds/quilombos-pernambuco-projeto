<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2400" preserveAspectRatio="none">
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8F3EA"/><stop offset=".48" stop-color="#F1E9DC"/><stop offset="1" stop-color="#F6F0E6"/></linearGradient>
 <radialGradient id="sun"><stop stop-color="#FFFDF6" stop-opacity=".9"/><stop offset="1" stop-color="#FFFDF6" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="8"/><feColorMatrix values="0.8 0 0 0 0.2 0 0.8 0 0 0.18 0 0 0.8 0 0.12 0 0 0 .10 0"/></filter>
 <g id="leaf"><ellipse rx="34" ry="13" fill="#69734F"/><path d="M-30 0 Q0 -5 30 0" stroke="#3D5038" stroke-width="2" fill="none"/></g>
 <g id="branch" fill="#465A3E" opacity=".32">
  <path d="M0 0 Q90 80 170 180 M75 65 Q130 25 185 10 M105 100 Q155 120 220 105 M145 150 Q190 190 250 205" fill="none" stroke="#465A3E" stroke-width="13" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(180 10) rotate(-18) scale(1.2)"/><use href="#leaf" transform="translate(215 105) rotate(12)"/><use href="#leaf" transform="translate(250 205) rotate(28)"/>
  <use href="#leaf" transform="translate(35 45) rotate(35)"/><use href="#leaf" transform="translate(105 100) rotate(-22)"/><use href="#leaf" transform="translate(170 180) rotate(18)"/>
  <use href="#leaf" transform="translate(75 65) rotate(-35)"/><use href="#leaf" transform="translate(145 150) rotate(42)"/>
 </g>
</defs>
<rect width="1600" height="2400" fill="url(#paper)"/>
<rect width="1600" height="2400" filter="url(#grain)" opacity=".13"/>
<ellipse cx="300" cy="250" rx="550" ry="420" fill="url(#sun)"/>
<ellipse cx="1320" cy="1050" rx="580" ry="560" fill="url(#sun)" opacity=".48"/>
<g filter="url(#blur)" opacity=".18">
 <use href="#branch" transform="translate(1280 -10) rotate(18) scale(2.2)"/>
 <use href="#branch" transform="translate(-100 950) rotate(-25) scale(2.5)"/>
 <use href="#branch" transform="translate(1270 1900) rotate(165) scale(2.1)"/>
</g>
<g filter="url(#blur)" opacity=".08">
 <use href="#branch" transform="translate(700 480) rotate(70) scale(1.7)"/>
 <use href="#branch" transform="translate(450 1600) rotate(205) scale(1.8)"/>
</g>
<rect width="1600" height="2400" fill="#F0E8DC" opacity=".08"/>
</svg>